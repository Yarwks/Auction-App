services:
  backend:
    build:
      context: ./Django-project/djangobackend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1


  frontend:
    build:
      context: ./Frontend-Auction-App/AuctionApp
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend