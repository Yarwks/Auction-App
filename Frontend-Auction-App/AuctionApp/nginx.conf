server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # React Router handles routing client-side. Without this fallback,
        # refreshing (or directly visiting) a route like /auctions/5 sends
        # nginx looking for a literal file at that path, which doesn't
        # exist, so it 404s. Falling back to index.html lets React Router
        # take over and render the right page once the app loads.
        try_files $uri $uri/ /index.html;
    }
}
