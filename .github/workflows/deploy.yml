name: Build and Test Docker Containers

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Test Docker Compose Build
      run: |
        docker compose build

    - name: Run Backend Container Test
      run: |
        docker compose up -d
        docker compose ps

    - name: Trigger Render Deploy
      run: curl -X POST ${{ https://api.render.com/deploy/srv-d9j19k7aqgkc73aqmgmg?key=-H7n7mFdxJ4 }}